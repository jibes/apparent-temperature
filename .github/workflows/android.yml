name: Android

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - index.html
      - vite.config.ts
      - android/**
      - capacitor.config.json
      - package.json
      - package-lock.json
      - .github/workflows/android.yml
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release for the current package.json version if it has no tag yet
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP: apparent-temperature
  APP_ID: net.bruenecke.apparenttemperature

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tagged: ${{ steps.version.outputs.tagged }}
      signed: ${{ steps.keystore.outputs.signed }}
      signer: ${{ steps.signer.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tags decide whether this version is released

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: npm ci
      - run: npm test

      - name: Version
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi
          # Reproducible builds: every timestamp derives from the commit.
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build web and sync into the shell
        run: |
          npm run build
          npx cap sync android

      - name: Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with the debug key. This build will not be released."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gradle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect
        run: |
          v='${{ steps.version.outputs.version }}'
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/$APP-$v.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/$APP-$v.aab"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Signer check
        id: signer
        env:
          EXPECTED: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs out/*.apk | tee signer.txt
          sha=$(grep -m1 'certificate SHA-256 digest' signer.txt | awk '{print $NF}')
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Signer SHA-256: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ steps.keystore.outputs.signed }}' = true ] && [ -n "$EXPECTED" ]; then
            want=$(echo "$EXPECTED" | tr -d ':' | tr 'A-F' 'a-f')
            [ "$sha" = "$want" ] || { echo "::error::Signer $sha does not match ANDROID_CERT_SHA256"; exit 1; }
          fi

      - name: No Google Play Services
        run: |
          if unzip -p out/*.apk 'classes*.dex' | grep -aq 'Lcom/google/android/gms/'; then
            echo "::error::GMS classes found in the APK"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: out/
          retention-days: 14

  # Boots the APK on an emulator (SDK tools on the runner, no third-party
  # action) and fails on any web error the WebView logs.
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API: '35'
      IMAGE: system-images;android-35;google_apis;x86_64
      # One AVD folder for avdmanager and the emulator; their defaults differ.
      ANDROID_AVD_HOME: ${{ github.workspace }}/avd
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start emulator
        timeout-minutes: 12
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$sdk/sdkmanager" --licenses >/dev/null
          "$sdk/sdkmanager" "emulator" "platform-tools" "$IMAGE" >/dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$sdk/avdmanager" create avd -n smoke -k "$IMAGE" --force
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -accel-check
          nohup "$ANDROID_HOME/emulator/emulator" -avd smoke -no-window -no-audio -no-boot-anim \
            -no-metrics -gpu swiftshader_indirect -no-snapshot > emulator.log 2>&1 &
          adb="$ANDROID_HOME/platform-tools/adb"
          # Bounded waits: a dead emulator fails here with its log, not at the job timeout.
          timeout 300 "$adb" wait-for-device || { echo "::error::Emulator never came up"; cat emulator.log; exit 1; }
          booted=
          for _ in $(seq 1 150); do
            [ "$("$adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && { booted=1; break; }
            sleep 2
          done
          [ -n "$booted" ] || { echo "::error::Emulator did not finish booting"; cat emulator.log; exit 1; }
          "$adb" shell input keyevent 82

      - name: Smoke test
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" install -g out/*.apk   # -g: pre-grant location, no permission dialog
          "$adb" logcat -c
          "$adb" shell am start -W -n "$APP_ID/.MainActivity"
          sleep 25
          # The tab bar renders in either language. The WebView's accessibility
          # tree can lag behind the render, so retry the dump for up to a minute.
          rendered=
          for _ in $(seq 1 12); do
            # uiautomator itself is sometimes killed on the device (exit 137); retry.
            "$adb" shell uiautomator dump /sdcard/ui.xml >/dev/null || true
            "$adb" pull /sdcard/ui.xml ui.xml >/dev/null 2>&1 || true
            grep -sEq 'Feels like|Gefühlt' ui.xml && { rendered=1; break; }
            sleep 5
          done
          "$adb" logcat -d > logcat.txt
          [ -n "$rendered" ] || { echo "::error::App UI did not render"; cat ui.xml; exit 1; }
          # Web errors: console.error/uncaught exceptions from the WebView, CSP violations.
          if grep -E 'E Capacitor/Console|Uncaught|Content Security Policy' logcat.txt; then
            echo "::error::Web errors in logcat"
            exit 1
          fi
          "$adb" shell pidof "$APP_ID" >/dev/null || { echo "::error::App is not running"; exit 1; }

      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-logs
          path: |
            logcat.txt
            ui.xml
            emulator.log
          retention-days: 7

  release:
    needs: [build, emulator]
    if: >-
      needs.build.outputs.tagged == 'false' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.release))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Require the release key
        if: needs.build.outputs.signed != 'true'
        run: |
          echo "::warning::No signing secrets; v${{ needs.build.outputs.version }} is not released."
          exit 0

      - if: needs.build.outputs.signed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: out

      - name: Publish
        if: needs.build.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
          SIGNER: ${{ needs.build.outputs.signer }}
        run: |
          cat > notes.md <<EOF
          Source: ${{ github.server_url }}/${{ github.repository }}

          Signer certificate SHA-256: \`$SIGNER\`
          EOF
          gh release create "v$V" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$V" \
            --notes-file notes.md
