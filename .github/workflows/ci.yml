name: CI

on:
  pull_request:
  # main is checked by deploy.yml, which calls this workflow
  workflow_call:
    inputs:
      base:
        description: Base path for the build (e.g. /repo/)
        type: string
        default: ./

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build and e2e must agree on the base path, or Playwright opens a 404.
      VITE_BASE: ${{ inputs.base || './' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      - name: Build
        run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      - if: failure()
        # TODO pin to SHA (Dependabot keeps it current)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
